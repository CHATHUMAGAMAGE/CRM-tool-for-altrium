<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#f7f9fc"
    />

    <script>
      ;(() => {
        const storageKey = 'eleven_appearance'
        let appearance = 'system'

        try {
          const storedAppearance = localStorage.getItem(storageKey)

          if (
            storedAppearance === 'light' ||
            storedAppearance === 'dark' ||
            storedAppearance === 'system'
          ) {
            appearance = storedAppearance
          }
        } catch {
          // Storage can be unavailable in privacy-restricted contexts.
        }

        const resolvedMode =
          appearance === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : appearance

        document.documentElement.dataset.elevenTheme = resolvedMode
        document.documentElement.dataset.elevenAppearance = appearance
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            'content',
            resolvedMode === 'dark' ? '#090a0c' : '#f7f9fc',
          )
      })()
    </script>

    <meta
      name="description"
      content="ELEVEN CRM — Lead management built for Altrium."
    />

    <title>ELEVEN CRM</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
