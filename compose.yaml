services:
  db:
    image: postgres:16
    container_name: eleven_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eleven_crm
      POSTGRES_USER: eleven_user
      POSTGRES_PASSWORD: eleven_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleven_user -d eleven_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eleven_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: eleven_crm
      DB_USER: eleven_user
      DB_PASSWORD: eleven_password
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
